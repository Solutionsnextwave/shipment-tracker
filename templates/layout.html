
<!DOCTYPE html>
<html>
<head>
    <title>Shipment Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container-fluid">
    <a class="navbar-brand d-flex align-items-center" href="/"><img src="/static/img/logo.png" style="height:40px;margin-right:10px;"> Tracker</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu"><span class="navbar-toggler-icon"></span></button>
    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="navbar-nav ms-auto">
        {% if session.get('user') %}
          <li class="nav-item"><a class="nav-link" href="/status">Status</a></li>
          {% if session['user'].can_edit %}<li class="nav-item"><a class="nav-link" href="/add-po">Add PO</a></li>{% endif %}
          {% if session['user'].is_admin %}
            <li class="nav-item"><a class="nav-link" href="/companies">Companies</a></li>
            <li class="nav-item"><a class="nav-link" href="/users">Users</a></li>
          {% endif %}
          <li class="nav-item"><a class="nav-link" href="/logout">Logout</a></li>
        {% endif %}
      </ul>
    </div>
  </div>
</nav>
<div class="container mt-4">{% block content %}{% endblock %}</div>
</body>
</html>
