
<!DOCTYPE html>
<html><head><title>Login</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body>
<div class="container mt-5"><div class="row justify-content-center"><div class="col-md-4">
    <div class="card shadow p-4">
        <img src="/static/img/logo.png" class="mx-auto d-block mb-3" style="max-width: 150px;">
        <h4 class="text-center mb-3">Login</h4>
        {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
        <form method="POST">
            <input type="email" name="email" placeholder="Email" class="form-control mb-2" required>
            <input type="password" name="password" placeholder="Password" class="form-control mb-3" required>
            <button class="btn btn-primary w-100">Login</button>
        </form>
    </div>
</div></div></div>
</body></html>
