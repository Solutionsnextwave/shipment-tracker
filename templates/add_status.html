{% extends 'layout.html' %}
{% block content %}
<h3>Add Delivery Status</h3>
<form method="POST">
  <div class="mb-3">
    <label>PO Number</label>
    <select name="po_number" class="form-control" required>
      {% for row in po_list %}
        <option value="{{ row.po_number }}">{{ row.po_number }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="mb-3"><label>Confirm Date</label><input type="date" name="confirm_date" class="form-control"></div>
  <div class="mb-3"><label>Delivery Location</label><input type="text" name="delivery_location" class="form-control"></div>
  <div class="mb-3"><label>Vendor Name</label><input type="text" name="vendor_name" class="form-control"></div>
  <div class="mb-3"><label>Brand</label><input type="text" name="brand" class="form-control"></div>
  <div class="mb-3"><label>Category</label><input type="text" name="category" class="form-control"></div>
  <div class="mb-3"><label>SKU Count</label><input type="number" name="sku_count" class="form-control"></div>
  <div class="mb-3"><label>Total PO Quantity</label><input type="number" name="total_po_qty" class="form-control"></div>
  <button class="btn btn-success">Submit</button>
</form>
{% endblock %}
{% extends 'layout.html' %}{% block content %}<h3>Add Delivery Status Page</h3>{% endblock %}
